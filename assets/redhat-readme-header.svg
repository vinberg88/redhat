    <g transform="translate(250 454)"><circle cx="0" cy="0" r="8" fill="#ffffff"/><text x="18" y="8">GNOME</text></g>
    <g transform="translate(430 454)"><circle cx="0" cy="0" r="8" fill="#36a8ff"/><text x="18" y="8">KDE Plasma 6</text></g>
    <g transform="translate(680 454)"><circle cx="0" cy="0" r="8" fill="#ffd34e"/><text x="18" y="8">Podman</text></g>
    <g transform="translate(860 454)"><circle cx="0" cy="0" r="8" fill="#f97316"/><text x="18" y="8">systemd</text></g>
    <g transform="translate(1048 454)"><circle cx="0" cy="0" r="8" fill="#22d3ee"/><text x="18" y="8">X410</text></g>
    <g transform="translate(1190 454)"><circle cx="0" cy="0" r="8" fill="#4da3ff"/><text x="18" y="8">WSLg</text></g>
  </g>
  <text x="840" y="532" text-anchor="middle" fill="#9bb5cc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="5">BUILD AN ENTERPRISE LINUX DESKTOP ON WINDOWS</text>
  <rect x="1.5" y="1.5" width="1677" height="557" rx="27" fill="none" stroke="#4da3ff" stroke-opacity=".35"/>
