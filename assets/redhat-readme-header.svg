    <rect x="88" y="-7" width="92" height="85" fill="#1fa6ff"/>
    <rect x="0" y="88" width="78" height="80" fill="#0877d4"/>
    <rect x="88" y="88" width="92" height="86" fill="#1298f2"/>
  </g>
  <text x="1390" y="318" fill="#a9cce9" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">WINDOWS + LINUX</text>
  <rect x="72" y="392" width="1536" height="104" rx="24" fill="#020914" opacity=".72" stroke="#1d5f96"/>
  <text x="108" y="428" fill="#ffd34e" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="5">DESKTOP LAB</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#eef7ff">
