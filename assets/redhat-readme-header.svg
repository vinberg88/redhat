<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-label="Red Hat Enterprise Linux 10.2 on WSL2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0d"/>
      <stop offset="55%" stop-color="#14090b"/>
      <stop offset="100%" stop-color="#1a0a0d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2a2a"/>
      <stop offset="100%" stop-color="#b00000"/>
    </linearGradient>
    <linearGradient id="hat" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="45%" stop-color="#d10000"/>
      <stop offset="100%" stop-color="#6a0000"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="6" fill="url(#red)"/>
  <rect y="414" width="1600" height="6" fill="url(#red)"/>

  <g fill="none" stroke="#ee0000" stroke-opacity="0.28" stroke-width="1.4">
    <path d="M40 360 H260 l20-20 H420 l16 16 H640"/>
    <path d="M80 388 H300 l12-12 H510"/>
    <path d="M1180 58 H1380 l18 18 H1560"/>
    <path d="M1240 86 H1460"/>
    <circle cx="260" cy="360" r="3" fill="#ee0000" stroke="none"/>
    <circle cx="420" cy="340" r="3" fill="#ee0000" stroke="none"/>
    <circle cx="1380" cy="58" r="3" fill="#ee0000" stroke="none"/>
  </g>

  <text x="72" y="168" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#c9c9c9" letter-spacing="4">COMMUNITY PROJECT</text>
  <text x="72" y="248" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="86" font-weight="700" fill="#ffffff">RHEL <tspan fill="#ee0000">10.2</tspan></text>
  <text x="72" y="302" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="28" fill="#d7d7d7">Enterprise Linux on Windows Subsystem for Linux</text>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="72" y="332" rx="8" width="92" height="32" fill="#1b1b1f" stroke="#ee0000"/>
    <text x="118" y="353" text-anchor="middle" fill="#ffffff">WSL2</text>
    <rect x="176" y="332" rx="8" width="92" height="32" fill="#1b1b1f" stroke="#3d3d44"/>
    <text x="222" y="353" text-anchor="middle" fill="#ffffff">MATE</text>
    <rect x="280" y="332" rx="8" width="110" height="32" fill="#1b1b1f" stroke="#3d3d44"/>
    <text x="335" y="353" text-anchor="middle" fill="#ffffff">GNOME</text>
    <rect x="402" y="332" rx="8" width="128" height="32" fill="#1b1b1f" stroke="#5294E2"/>
    <text x="466" y="353" text-anchor="middle" fill="#ffffff">KDE 6</text>
  </g>

  <g transform="translate(980,78)" filter="url(#glow)">
    <ellipse cx="210" cy="214" rx="210" ry="28" fill="#2a0000" opacity="0.55"/>
    <ellipse cx="210" cy="168" rx="228" ry="42" fill="url(#hat)"/>
    <ellipse cx="210" cy="160" rx="210" ry="28" fill="#7a0000"/>
    <path d="M78 150 C88 70 150 28 210 28 C270 28 332 70 342 150 C300 132 240 126 210 126 C180 126 120 132 78 150 Z" fill="url(#hat)"/>
    <path d="M132 86 C168 70 210 66 248 86 C230 78 190 76 132 86 Z" fill="#3a0000" opacity="0.55"/>
    <rect x="86" y="138" width="248" height="22" rx="6" fill="#1a1a1a"/>
    <rect x="86" y="138" width="248" height="6" fill="#ee0000" opacity="0.85"/>
    <path d="M100 70 C160 40 250 36 330 88" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="6"/>
  </g>

  <g transform="translate(1188,214)">
    <rect x="0" y="0" width="320" height="150" rx="14" fill="#151518" stroke="#2c2c32"/>
    <circle cx="22" cy="20" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="20" r="5" fill="#febc2e"/>
    <circle cx="58" cy="20" r="5" fill="#28c840"/>
    <text x="86" y="25" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#9aa0a6">wsl · rhel-10.2</text>
    <text x="22" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8bff9a">user@rhel:~$</text>
    <text x="132" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e8e8e8">kde6-x410 start</text>
    <text x="22" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8bff9a">[OK]</text>
    <text x="64" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#d0d0d0">Plasma 6 on X410</text>
    <text x="22" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8bff9a">[OK]</text>
    <text x="64" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#d0d0d0">WSLg audio ready</text>
  </g>
