<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="560" viewBox="0 0 1680 560" role="img" aria-label="Red Hat Enterprise Linux 10.2 on WSL2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101f"/>
      <stop offset="0.45" stop-color="#0a2a58"/>
      <stop offset="1" stop-color="#0d4d8c"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="30%" r="55%">
      <stop offset="0" stop-color="#3db7ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#3db7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe37a"/>
      <stop offset=".55" stop-color="#f0b429"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd34e" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffd34e" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7ec8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="goldGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1680" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1680" height="560" rx="28" fill="url(#glow)"/>
  <path d="M0 448 C280 350 470 520 760 430 S1240 340 1680 438 V560 H0Z" fill="#041526" opacity=".84"/>
  <path d="M-80 470 C280 320 520 530 880 410 S1320 330 1760 400" fill="none" stroke="url(#goldline)" stroke-width="6"/>
  <path d="M-20 118 C320 8 580 24 820 122" fill="none" stroke="#4da3ff" stroke-width="16" opacity=".22"/>
  <ellipse cx="1400" cy="118" rx="280" ry="126" fill="#1a91ff" opacity=".10" filter="url(#soft)"/>
  <g transform="translate(88 92)">
    <ellipse cx="78" cy="86" rx="86" ry="16" fill="#f0b429"/>
    <path d="M18 78 C24 28 50 8 78 8 C106 8 132 28 138 78 C118 66 94 62 78 62 C62 62 38 66 18 78Z" fill="#ffd34e"/>
    <rect x="28" y="70" width="100" height="10" rx="3" fill="#0a2a58"/>
    <rect x="28" y="70" width="100" height="3" fill="#4da3ff"/>
  </g>
  <text x="268" y="168" fill="#f7fbff" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="1">Red Hat Enterprise Linux</text>
  <text x="268" y="214" fill="#c4d4e8" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">ENTERPRISE LINUX ON WINDOWS</text>
  <text x="268" y="292" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="10">ON WSL2</text>
  <line x1="268" y1="248" x2="780" y2="248" stroke="#7aa0c2" stroke-width="2" opacity=".45"/>
  <g filter="url(#goldGlow)">
    <text x="900" y="318" fill="url(#num)" stroke="#ffe9a0" stroke-width="2" font-family="Segoe UI,Arial,sans-serif" font-size="228" font-weight="800" letter-spacing="-10">10.2</text>
  </g>
  <g transform="translate(1390 78) skewY(-6)" opacity=".92" filter="url(#goldGlow)">
