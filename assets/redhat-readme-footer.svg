<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 200" role="img" aria-label="Windows on the outside. Enterprise Linux on the inside.">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0d"/>
      <stop offset="100%" stop-color="#16090b"/>
    </linearGradient>
    <linearGradient id="fred" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a0000"/>
      <stop offset="50%" stop-color="#ee0000"/>
